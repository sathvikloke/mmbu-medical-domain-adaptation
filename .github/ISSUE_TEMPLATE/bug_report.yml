name: Bug report
description: Report a reproducible preparation-tool or documentation failure.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: "Use synthetic or redacted examples. Do not paste credentials, patient data, or restricted source assets."
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe the concrete failure and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the exact command, working directory, and smallest shareable input.
      render: shell
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include commit, operating system, Python version, and Pillow version if relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs and exit codes
      description: Include actual output from the failed command and relevant team helper checks. Mark checks you did not run.
      render: text
    validations:
      required: true

