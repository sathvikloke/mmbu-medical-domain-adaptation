[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmbu-precompute"
version = "0.3.0"
description = "Offline engineering preparation for MMBU; not an official evaluator"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
images = ["Pillow>=12.3,<13"]

[project.scripts]
mmbu-prep = "mmbu_prep.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
